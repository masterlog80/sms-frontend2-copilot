services:
  modem-dashboard:
    #build:
      #context: .
      #dockerfile: Dockerfile
    image: modem-dashboard:latest
    container_name: modem-dashboard
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyUSB1:/dev/ttyUSB1
      - /dev/ttyUSB2:/dev/ttyUSB2
      - /dev/ttyUSB3:/dev/ttyUSB3
      - /dev/ttyUSB4:/dev/ttyUSB4
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # image auto-detection
      - modem_data:/data
    ports:
      - "5003:5000"
    environment:
      MODEM_DEVICE: /dev/ttyUSB2   # primary device (always tried first)
      #MODEM_DEVICES: /dev/ttyUSB0,/dev/ttyUSB1,/dev/ttyUSB2  # optional: override fallback order
      POLL_INTERVAL: 5             # seconds between modem polls
      FORWARD_DELAY: 30            # seconds to wait before forwarding (allows multipart SMS to combine)
      DATA_DIR: /data              # persistent data directory (inside container)
      LOG_LEVEL: INFO              # DEBUG | INFO | WARNING | ERROR
      # IMAGE_NAME and IMAGE_VERSION are auto-detected from the Docker
      # socket mounted below — override here only if detection fails.
      #IMAGE_NAME: modem-dashboard
      #IMAGE_VERSION: latest
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/status')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  modem_data:
    driver: local

